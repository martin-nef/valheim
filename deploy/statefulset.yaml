---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valheim
  namespace: valheim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valheim
  template:
    metadata:
      labels:
        app: valheim
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - shitbox
      initContainers:
        # Installs the Thunderstore packages listed in MODS into the /config
        # PVC. The server image rsyncs /config/bepinex/plugins/ into the live
        # BepInEx install on every boot; the POST_BEPINEX_CONFIG_HOOK in the
        # ConfigMap does the same for patchers and adds --delete, so dropping a
        # mod from MODS actually uninstalls it.
        - name: mods
          image: alpine:3.20
          envFrom:
            - configMapRef:
                name: config
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              apk add --no-cache jq >/dev/null

              cfg=/config/bepinex
              cache=/config/modcache
              stage=/tmp/stage
              tries=5

              rm -rf "$stage" "$cfg.new"
              mkdir -p "$stage" "$cache" "$cfg.new/plugins" "$cfg.new/patchers"

              # Retries a command with a growing pause. Progress goes to stderr
              # so it stays out of command substitutions.
              retry() {
                i=1
                while :; do
                  if "$@"; then return 0; fi
                  if [ "$i" -ge "$tries" ]; then return 1; fi
                  echo "    attempt $i/$tries failed, retrying in $((i * 5))s" >&2
                  sleep $((i * 5))
                  i=$((i + 1))
                done
              }

              # An archive is only trusted once its central directory reads
              # back, which lives at the end of the file - so a truncated or
              # half-written download fails here instead of being cached.
              usable() { [ -f "$1" ] && unzip -l "$1" >/dev/null 2>&1; }

              # Downloads to .part and renames only on success, so the cache
              # never holds a partial archive.
              download() {
                rm -f "$2" "$2.part"
                if ! wget -qO "$2.part" "$1"; then
                  rm -f "$2.part"
                  return 1
                fi
                if ! usable "$2.part"; then
                  echo "    incomplete archive discarded" >&2
                  rm -f "$2.part"
                  return 1
                fi
                mv "$2.part" "$2"
              }

              latest() {
                wget -qO- "https://thunderstore.io/api/experimental/package/$1/$2/" \
                  | jq -re .latest.version_number
              }

              wanted=""
              entries=$(printf '%s\n' "${MODS:-}" | sed 's/#.*//; s/[[:space:]]//g' | grep . || true)
              for entry in $entries; do
                ns=${entry%%/*}
                rest=${entry#*/}
                name=${rest%%/*}
                case "$rest" in
                  */*) ver=${rest#*/} ;;
                  *)   ver=$(retry latest "$ns" "$name" || true) ;;
                esac

                if [ -z "$ver" ]; then
                  # Thunderstore unreachable and no version pinned: fall back to
                  # the newest cached copy so a restart during an outage boots.
                  zip=$(ls -t "$cache/$ns-$name-"*.zip 2>/dev/null | head -1 || true)
                  if [ -z "$zip" ]; then
                    echo "cannot resolve $ns/$name and nothing cached"
                    exit 1
                  fi
                  echo "==> $(basename "$zip" .zip) (cached, Thunderstore unreachable)"
                else
                  zip="$cache/$ns-$name-$ver.zip"
                  if usable "$zip"; then
                    echo "==> $ns-$name-$ver (cached)"
                  else
                    echo "==> $ns-$name-$ver"
                    if ! retry download \
                        "https://gcdn.thunderstore.io/live/repository/packages/$ns-$name-$ver.zip" \
                        "$zip"; then
                      echo "failed to download $ns-$name-$ver"
                      exit 1
                    fi
                  fi
                fi
                wanted="$wanted $(basename "$zip")"

                d="$stage/$ns-$name"
                mkdir -p "$d"
                # unzip exits 1 on warnings (e.g. backslash separators)
                unzip -qo "$zip" -d "$d" || [ $? -eq 1 ]

                # some packages store paths with backslashes, which unzip keeps literal
                find "$d" -depth -name '*\\*' | while IFS= read -r f; do
                  new=$(printf '%s' "$f" | tr '\\' '/')
                  mkdir -p "$(dirname "$new")"
                  mv "$f" "$new"
                done

                if [ -d "$d/plugins" ]; then
                  cp -a "$d/plugins/." "$cfg.new/plugins/"
                else
                  # flat package: assemblies sit at the archive root
                  [ -n "$(find "$d" -maxdepth 1 -name '*.dll' -print -quit)" ] \
                    || { echo "no plugin assemblies in $ns-$name-$ver"; exit 1; }
                  find "$d" -maxdepth 1 \( -name '*.dll' -o -name '*.deps.json' \) \
                    -exec cp -a {} "$cfg.new/plugins/" \;
                fi
                [ -d "$d/patchers" ] && cp -a "$d/patchers/." "$cfg.new/patchers/" || true
              done

              # drop superseded versions and any leftover .part files
              for f in "$cache"/*.zip "$cache"/*.part; do
                [ -e "$f" ] || continue
                case " $wanted " in
                  *" $(basename "$f") "*) ;;
                  *) echo "    removing stale $(basename "$f")"; rm -f "$f" ;;
                esac
              done

              # swap in only after every package was staged successfully
              mkdir -p "$cfg"
              rm -rf "$cfg/plugins" "$cfg/patchers"
              mv "$cfg.new/plugins" "$cfg.new/patchers" "$cfg/"
              rm -rf "$cfg.new" "$stage"
              echo "installed:" && ls -1 "$cfg/plugins"
          volumeMounts:
            - name: data
              mountPath: /config
      containers:
        - name: valheim
          image: lloesche/valheim-server:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "2Gi"
            limits:
              memory: "10Gi"
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: secret
          volumeMounts:
            - name: data
              mountPath: /config
            - name: server-files
              mountPath: /opt/valheim
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 3.5Gi
    - metadata:
        name: server-files
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 1.5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: valheim
  labels:
    app: valheim
spec:
  ports:
    - port: 2456
      name: valheim
      protocol: UDP
  clusterIP: None
  selector:
    app: valheim
