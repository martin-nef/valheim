apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  SERVER_NAME: Stray Dogs
  WORLD_NAME: DeepNorth
  SERVER_PUBLIC: "false"
  BACKUPS_CRON: 0 0/2 * * *

  # Vanilla world modifier: resource drops one notch above default
  # (MuchLess / Less / Default / More / MuchMore / Most). Applied to the existing world
  # on startup and saved into the world file - so removing this line does NOT
  # revert it; set "Resources Default" to go back.
  SERVER_ARGS: -modifier Resources Most

  # Mod loader. Mutually exclusive with VALHEIM_PLUS.
  BEPINEX: "true"

  # Thunderstore packages, one per line, as Author/Mod or Author/Mod/Version.
  # Without a version the latest release is resolved at pod start.
  # Dependencies are NOT resolved automatically - list them explicitly.
  MODS: |
    ValheimModding/YamlDotNet
    ArgusMagnus/ServersideQoL
    ArgusMagnus/ServersideQoL_JustSleep
    ArgusMagnus/ServersideQoL_LetItFloat
    ArgusMagnus/ServersideQoL_AutoPortalHub
    ArgusMagnus/ServersideQoL_AutoProcess
    ArgusMagnus/ServersideQoL_AutoDoors
    ArgusMagnus/ServersideQoL_Skills
    ArgusMagnus/ServersideQoL_SmartDefense
    ArgusMagnus/ServersideQoL_ContainerSigns
    ArgusMagnus/ServersideQoL_AutoStore
    ArgusMagnus/ServersideQoL_TameAssist
    ArgusMagnus/ServersideQoL_PortalProgression
    ArgusMagnus/ServersideQoL_Player
    ValheimModding/Jotunn
    MidnightMods/NetworkPerformanceSystem
    Sfantul/PortalGhostFix
  #  VerdantsAscent/FiresGhettoNetworking

  POST_BEPINEX_CONFIG_HOOK: >-
    rsync -a --delete --itemize-changes /config/bepinex/plugins/ "$plugins_path" ;
    rsync -a --delete --itemize-changes /config/bepinex/patchers/ "$(dirname "$plugins_path")/patchers"
