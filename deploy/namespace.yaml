apiVersion: v1
kind: Namespace
metadata:
  name: valheim
  # baseline, not restricted: the server image must start as root (see the
  # StatefulSet). warn shows anything that falls short of restricted.
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
